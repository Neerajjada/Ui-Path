name: Copy Files to Windows VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy files via WinRM
        shell: powershell
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USERNAME }}
          VM_PASS: ${{ secrets.VM_PASSWORD }}
        run: |
          $Server = $env:VM_HOST
          $Username = $env:VM_USER
          # Convert environment variable safely to secure string without string interpolation errors
          $Password = $env:VM_PASS | ConvertTo-SecureString -AsPlainText -Force
          $Credential = New-Object System.Management.Automation.PSCredential($Username, $Password)

          $SessionOption = New-PSSessionOption -SkipCACheck -SkipCNCheck

          Write-Host "Establishing WinRM session to $Server..."
          $Session = New-PSSession -ComputerName $Server -Credential $Credential -UseSSL -SessionOption $SessionOption

          # Source and destination paths
          $SourceFolder = "$env:GITHUB_WORKSPACE\python\new.txt"
          $DestinationFolder = "C:\pythonfiles"

          Write-Host "Copying files to $DestinationFolder..."
          Copy-Item -Path $SourceFolder -Destination $DestinationFolder -ToSession $Session -Force

          Remove-PSSession $Session
          Write-Host "Deployment completed successfully!"
