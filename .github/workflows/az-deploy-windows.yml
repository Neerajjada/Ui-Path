name: Copy Files to Windows VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy files via WinRM
        shell: powershell
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USERNAME: ${{ secrets.VM_USERNAME }}
          VM_PASSWORD: ${{ secrets.VM_PASSWORD }}
        run: |
          $Server =$env:VM_HOST
          $Username =$env:VM_USERNAME
          $SecurePassword = ConvertTo-SecureString$env:VM_PASSWORD -AsPlainText -Force

          $Credential = New-Object System.Management.Automation.PSCredential($Username,$SecurePassword)

          # Skip SSL certificate validation for self-signed certificates
          $SessionOption = New-PSSessionOption -SkipCACheck -SkipCNCheck

          Write-Host "Establishing WinRM session to $Server..."
          $Session = New-PSSession -ComputerName$Server -Credential $Credential -UseSSL -SessionOption$SessionOption

          try {
            $SourceFolder = Join-Path "${{ github.workspace }}" "Ui-Path\python\new.txt"
            $DestinationFolder = "C:\pythonfiles"

            # Ensure remote destination directory exists before copying
            Invoke-Command -Session $Session -ScriptBlock {
              param($Dest)
              if (-not (Test-Path -Path $Dest)) {
                New-Item -ItemType Directory -Path $Dest -Force | Out-Null
              }
            } -ArgumentList $DestinationFolder

            Write-Host "Copying files to $DestinationFolder..."

            Copy-Item `
              -Path $SourceFolder `
              -Destination $DestinationFolder `
              -ToSession $Session `
              -Force

            Write-Host "Deployment completed successfully!"
          }
          finally {
            if ($Session) {
              Remove-PSSession $Session
            }
          }
