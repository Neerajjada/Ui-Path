name: Copy Files to Windows VM via SSH (Password)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy files via PowerShell over SSH with Timestamped Backup
        shell: powershell
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USERNAME: ${{ secrets.VM_USERNAME }}
          VM_PASSWORD: ${{ secrets.VM_PASSWORD }}
          VM_PORT: ${{ secrets.VM_PORT | default('22') }}
        run: |
          $Server = $env:VM_HOST
          $Username = $env:VM_USERNAME
          $PlainPassword = $env:VM_PASSWORD
          $Port = $env:VM_PORT

          $SecurePassword = ConvertTo-SecureString -String $PlainPassword -AsPlainText -Force
          $Credential = New-Object System.Management.Automation.PSCredential($Username, $SecurePassword)

          Write-Host "Establishing SSH session to $Server on port $Port..."
          # Using -HostName and -Port enables PowerShell remoting over SSH (Port 22) instead of WinRM (Port 5986)
          $Session = New-PSSession -HostName $Server -Port $Port -Credential $Credential

          try {
              $SourcePath = "${{ github.workspace }}\python\new.txt"
              $DestinationFolder = "C:\pythonfiles"

              # 1. Ensure target directory exists and create uniquely timestamped backup
              Invoke-Command -Session $Session -ScriptBlock {
                  param($Dest)

                  if (-not (Test-Path -Path $Dest)) {
                      New-Item -ItemType Directory -Path $Dest -Force | Out-Null
                  }

                  $TargetFile = Join-Path -Path $Dest -ChildPath "new.txt"

                  if (Test-Path -Path $TargetFile) {
                      $Timestamp = (Get-Date).ToString("dd-MMM-yyyy_HH-mm-ss")
                      $BackupFileName = "backup_${Timestamp}_new.txt"
                      $BackupPath = Join-Path -Path $Dest -ChildPath $BackupFileName

                      $Counter = 1
                      while (Test-Path -Path $BackupPath) {
                          $BackupFileName = "backup_${Timestamp}_(${Counter})_new.txt"
                          $BackupPath = Join-Path -Path $Dest -ChildPath $BackupFileName
                          $Counter++
                      }

                      Write-Host "Backing up existing file to $BackupFileName..."
                      Copy-Item -Path $TargetFile -Destination $BackupPath -Force
                  }
              } -ArgumentList $DestinationFolder

              # 2. Copy the latest file from repo to destination over the SSH session
              Write-Host "Copying latest file $SourcePath to $DestinationFolder..."
              Copy-Item -Path $SourcePath -Destination $DestinationFolder -ToSession $Session -Force

              Write-Host "Deployment completed successfully!"
          }
          finally {
              if ($Session) {
                  Remove-PSSession -Session $Session
              }
          }
